name: budget-gremlin
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set your private HTTPS origin}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a 64-character hex encryption key}
      SECURE_COOKIES: "true"
    volumes:
      - gremlin-data:/data
      - gremlin-backups:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${LAN_IP:?Set LAN_IP}:80:80"
      - "${LAN_IP:?Set LAN_IP}:443:443"
    environment:
      LAN_IP: ${LAN_IP:?Set LAN_IP}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - gremlin-caddy-data:/data
      - gremlin-caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
volumes:
  gremlin-caddy-data:
  gremlin-caddy-config:
  gremlin-data:
  gremlin-backups:
